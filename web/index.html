<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LocalRSI · 本地 Agent</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101318;color:#e5e9f0;font:15px/1.6 system-ui,sans-serif}main{max-width:1150px;margin:auto;padding:32px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #303843;padding-bottom:20px}h1{margin:0;font-size:28px}small,.muted{color:#9aa9bc}.tag{padding:5px 12px;background:#193b33;color:#8fe2bc;border-radius:20px}.grid{display:grid;grid-template-columns:270px 1fr;gap:24px;margin-top:26px}aside,section{background:#191e26;border:1px solid #303843;border-radius:14px;padding:20px}textarea{width:100%;resize:vertical;min-height:130px;border:1px solid #425067;background:#101318;color:#e5e9f0;padding:14px;border-radius:8px;font:inherit}button{background:#92e4be;color:#0b2017;border:0;border-radius:7px;padding:10px 17px;cursor:pointer;font:inherit}button.secondary{background:#313e50;color:#eef2f9}button:disabled{opacity:.45;cursor:wait}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.panel{margin-top:20px;white-space:pre-wrap;overflow-wrap:anywhere}#events{font:13px/1.8 ui-monospace,monospace;color:#b1bdd0;max-height:300px;overflow:auto}#approval{border:1px solid #d9b56b;background:#30291d;padding:16px;border-radius:9px;margin-top:16px}pre{white-space:pre-wrap;word-break:break-all}#history button{display:block;width:100%;text-align:left;margin:8px 0;font-size:12px}#preview{max-height:160px;max-width:100%;margin-top:12px;border-radius:8px}label{cursor:pointer}input[type=file]{max-width:100%;font:12px system-ui}h2{font-size:16px}.status{color:#92e4be}a{color:#92e4be}@media(max-width:760px){main{padding:15px}.grid{grid-template-columns:1fr}header{align-items:flex-start}.tag{font-size:11px}aside{order:2}}
</style><main><header><div><h1>LocalRSI <small>本地 Agent</small></h1><small>文字规划 · 图片描述 · 文件与命令工具</small></div><span class="tag">本机运行 · 无商业 API</span></header><div class="grid"><aside><h2>工作区</h2><p id="workspace" class="muted"></p><p class="muted">文件工具限于此目录。写入和命令逐项批准。命令获批后具有当前用户权限，并非沙箱。</p><h2>模型</h2><p>Qwen3 4B · 文字<br>SmolVLM 500M · 图片</p><p id="vision" class="muted"></p><h2>确认一条长期记忆</h2><textarea id="note" style="min-height:70px" placeholder="如：论文笔记默认使用中文"></textarea><button id="saveNote" class="secondary">保存记忆</button><p id="noteStatus"></p><h2>任务记录</h2><div id="history"></div></aside><section><h2>分配任务</h2><textarea id="prompt" placeholder="例如：查看工作区文件，为项目生成 README 草稿并写入 README.md。也可附一张图片分析。"></textarea><div class="actions"><input id="image" type="file" accept="image/png,image/jpeg"><button id="send">开始任务</button><button id="clear" class="secondary">清除图片</button></div><img id="preview" hidden><p class="muted">图片缩放至最长边 768 像素。视觉模型适合粗略描述，细小文字、图表数值及坐标需核实。任务运行时请勿关闭服务。</p><p id="state" class="status">就绪</p><div id="approval" hidden><b>需要你批准的操作</b><pre id="proposal"></pre><div class="actions"><button id="approve">批准一次</button><button id="deny" class="secondary">拒绝</button></div></div><div id="answer" class="panel"></div><h2>执行记录</h2><div id="events" class="panel"></div></section></div></main>
<script>
let image=null,task=null,timer=null;const $=id=>document.getElementById(id);
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}
function error(e){$('state').textContent='错误：'+e.message;$('send').disabled=false}
async function status(){const s=await api('/api/status');$('workspace').textContent=s.workspace;$('vision').textContent=s.vision_ready?'视觉权重已就绪；按需切换加载':'视觉权重准备中';$('history').replaceChildren();s.tasks.slice(-15).reverse().forEach(t=>{const b=document.createElement('button');b.className='secondary';b.textContent=t.id.slice(0,8)+' · '+t.status;b.onclick=()=>{task=t.id;poll()};$('history').append(b)})}
async function poll(){clearTimeout(timer);try{const t=await api('/api/tasks/'+task);$('state').textContent='状态：'+t.status;$('answer').textContent=t.answer||'';$('events').textContent=t.events.map(e=>new Date(e.time*1000).toLocaleTimeString()+'  '+e.text).join('\n');$('approval').hidden=t.status!=='approval';$('proposal').textContent=t.pending?JSON.stringify(t.pending.arguments,null,2):'';$('send').disabled=['running','queued','approval'].includes(t.status);await status();if(['running','queued'].includes(t.status))timer=setTimeout(poll,1200)}catch(e){error(e)}}
$('send').onclick=async()=>{try{$('send').disabled=true;$('answer').textContent='';const t=await api('/api/tasks',{prompt:$('prompt').value,image});task=t.id;poll()}catch(e){error(e)}};
async function decide(approve){try{$('approval').hidden=true;await api('/api/approve',{id:task,approve});poll()}catch(e){error(e)}}$('approve').onclick=()=>decide(true);$('deny').onclick=()=>decide(false);
$('image').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!['image/png','image/jpeg'].includes(f.type)||f.size>10*1024*1024){error(Error('请选择小于10MB的PNG或JPEG'));return}try{const bitmap=await createImageBitmap(f),scale=Math.min(1,768/Math.max(bitmap.width,bitmap.height));const c=document.createElement('canvas');c.width=Math.round(bitmap.width*scale);c.height=Math.round(bitmap.height*scale);c.getContext('2d').drawImage(bitmap,0,0,c.width,c.height);image=c.toDataURL('image/jpeg',.85);$('preview').src=image;$('preview').hidden=false;bitmap.close()}catch(e){error(e)}};
$('clear').onclick=()=>{image=null;$('image').value='';$('preview').hidden=true};$('saveNote').onclick=async()=>{try{await api('/api/notes',{text:$('note').value});$('note').value='';$('noteStatus').textContent='已保存，可通过记忆搜索工具检索。'}catch(e){error(e)}};status().catch(error);
</script>
<style>details{border-top:1px solid #354052;margin-top:18px;padding-top:12px}summary{cursor:pointer;color:#9ae6c4}select,input[type=text]{background:#101318;color:#eee;border:1px solid #425067;border-radius:6px;padding:8px;max-width:100%}.group{display:inline-block;font-size:12px;margin:4px 8px 4px 0}.hint{font-size:12px;color:#9aa9bc}.file{margin:6px 0}#feedbackBox{border-top:1px solid #354052;padding-top:12px;margin-top:18px}</style>
<script>
// Capability controls keep all actions on the same local API as the CLI.
const section=document.querySelector('section'),aside=document.querySelector('aside');
const options=document.createElement('div');options.innerHTML=`<div class="actions"><label>模型 <select id="provider"><option value="local">本机 4B</option><option value="remote">远端（需配置）</option></select></label><label><input id="continueTask" type="checkbox">续接当前任务</label><button id="cancelTask" class="secondary">取消任务</button></div><div id="groups"></div><p class="hint">勾选本次需要的工具，减少小模型上下文开销。未勾选时按任务文本识别。</p>`;section.insertBefore(options,$('prompt'));
const labels={documents:'PDF / Word',knowledge:'知识库',vision:'图片 / OCR',coding:'代码 / 测试',browser:'浏览器',desktop:'桌面',audio:'语音'};
Object.entries(labels).forEach(([value,label])=>{const l=document.createElement('label');l.className='group';const c=document.createElement('input');c.type='checkbox';c.value=value;c.name='toolgroup';l.append(c,document.createTextNode(label));$('groups').append(l)});
const knowledge=document.createElement('details');knowledge.open=true;knowledge.innerHTML=`<summary>资料与知识库</summary><p class="hint">上传到工作区，支持 PDF、DOCX、文本。索引在后台生成，完成后再检索。</p><input type="file" id="docUpload"><button id="uploadDoc" class="secondary">上传</button><div id="files"></div><input id="query" type="text" placeholder="搜索知识库"><button id="searchKB" class="secondary">检索</button><pre id="kbResult"></pre>`;aside.append(knowledge);
const memory=document.createElement('details');memory.innerHTML='<summary>已保存的记忆</summary><div id="notesList"></div>';aside.append(memory);
const evolve=document.createElement('details');evolve.innerHTML=`<summary>评测与改进</summary><p class="hint">候选提示词需与基线进行六项冒烟评测，通过无退化门槛后可手动启用。不能代表通用能力提升。</p><textarea id="candidate" placeholder="候选行为改进，如：先核对来源，再总结。"></textarea><button id="evaluate" class="secondary">创建并评测</button><button id="activate" class="secondary">启用通过的候选</button><button id="rollback" class="secondary">回到基线</button><button id="exportData" class="secondary">导出审核样本</button><pre id="evalResult"></pre>`;aside.append(evolve);
const feedback=document.createElement('div');feedback.id='feedbackBox';feedback.innerHTML=`<b>任务反馈</b><textarea id="correction" style="min-height:70px" placeholder="正确答案或具体纠正（可选）"></textarea><button id="good" class="secondary">结果正确</button><button id="bad" class="secondary">记录问题</button><span id="feedbackState"></span><div class="actions"><button id="record" class="secondary">本地录音 5 秒</button><p class="hint">使用本机麦克风和离线识别模型，不调用浏览器云端语音。</p></div>`;section.append(feedback);
let candidateId=null,evaluationId=null,jobTimer=null;
$('send').onclick=async()=>{try{$('send').disabled=true;$('answer').textContent='';const groups=[...document.querySelectorAll('input[name=toolgroup]:checked')].map(c=>c.value);const t=await api('/api/tasks',{prompt:$('prompt').value,image,groups,provider:$('provider').value,parent:$('continueTask').checked?task:null});task=t.id;poll()}catch(e){error(e)}};
$('cancelTask').onclick=async()=>{try{if(task){await api('/api/cancel',{id:task});poll()}}catch(e){error(e)}};
const oldPoll=poll;poll=async()=>{await oldPoll();if(!$('approval').hidden&&task){const t=await api('/api/tasks/'+task);$('proposal').textContent=JSON.stringify(t.pending.preview||t.pending.arguments,null,2)}};
async function refreshFiles(){const files=await api('/api/files');$('files').replaceChildren();files.filter(f=>!f.directory).forEach(f=>{const row=document.createElement('div');row.className='file';row.append(document.createTextNode(f.name+' '));const b=document.createElement('button');b.className='secondary';b.textContent='索引';b.onclick=async()=>{try{const j=await api('/api/index',{path:f.name});$('kbResult').textContent='索引任务 '+j.id;watchJobs()}catch(e){error(e)}};row.append(b);$('files').append(row)})}
async function refreshNotes(){const notes=await api('/api/notes');$('notesList').replaceChildren();notes.forEach(n=>{const row=document.createElement('p');row.append(document.createTextNode(n[1]+' '));const b=document.createElement('button');b.className='secondary';b.textContent='删除';b.onclick=async()=>{await api('/api/notes/delete',{id:n[0]});refreshNotes()};row.append(b);$('notesList').append(row)})}
$('uploadDoc').onclick=async()=>{try{const file=$('docUpload').files[0];if(!file)throw Error('请选择文件');if(file.size>5*1024*1024)throw Error('GUI 上传上限5MB；较大文件请手动放入工作区');const data=new Uint8Array(await file.arrayBuffer());let binary='';for(let i=0;i<data.length;i+=8192)binary+=String.fromCharCode(...data.subarray(i,i+8192));await api('/api/upload',{name:file.name,content:btoa(binary)});await refreshFiles()}catch(e){error(e)}};
$('searchKB').onclick=async()=>{try{$('kbResult').textContent='检索中…';$('kbResult').textContent=JSON.stringify(await api('/api/search',{query:$('query').value}),null,2)}catch(e){error(e)}};
const oldSave=$('saveNote').onclick;$('saveNote').onclick=async()=>{await oldSave();refreshNotes()};
async function rate(score){try{if(!task)throw Error('先选择任务');await api('/api/feedback',{id:task,score,correction:$('correction').value});$('feedbackState').textContent='反馈已保存'}catch(e){error(e)}}$('good').onclick=()=>rate(1);$('bad').onclick=()=>rate(-1);
async function watchJobs(){clearTimeout(jobTimer);try{const s=await api('/api/status');$('kbResult').textContent=JSON.stringify(s.index_jobs.filter(j=>j.type!=='evaluation'),null,2);const ev=s.index_jobs.find(j=>j.id===evaluationId);if(ev)$('evalResult').textContent=JSON.stringify(ev,null,2);if(s.index_jobs.some(j=>j.status==='running'))jobTimer=setTimeout(watchJobs,2500)}catch(e){error(e)}}
$('evaluate').onclick=async()=>{try{candidateId=(await api('/api/evolve/create',{prompt:$('candidate').value})).id;evaluationId=(await api('/api/evolve/evaluate',{id:candidateId})).id;watchJobs()}catch(e){error(e)}};
$('activate').onclick=async()=>{try{$('evalResult').textContent=JSON.stringify(await api('/api/evolve/activate',{id:candidateId,evaluation:evaluationId}),null,2)}catch(e){error(e)}};
$('rollback').onclick=async()=>{$('evalResult').textContent=JSON.stringify(await api('/api/evolve/rollback',{}))};
$('exportData').onclick=async()=>{$('evalResult').textContent=JSON.stringify(await api('/api/export-training',{}),null,2)};
$('record').onclick=async()=>{try{$('record').disabled=true;$('state').textContent='录音5秒并离线识别…';const r=await api('/api/record',{});$('prompt').value=r.text;$('state').textContent='录音转写完成，请检查后提交'}catch(e){error(e)}finally{$('record').disabled=false}};
refreshFiles().catch(error);refreshNotes().catch(error);
</script></html>
