name: core-tests
on: [push, pull_request]
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF==1.26.6 python-docx
      - run: python -m unittest discover -s tests -p test_core.py -v
      - run: python -m compileall -q app.py cli.py features.py extension_tools.py providers.py evolution.py train_lora.py remote_training.py
